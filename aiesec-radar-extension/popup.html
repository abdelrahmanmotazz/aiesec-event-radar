<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AIESEC Event Radar Harvester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 340px; background: #0b0f19; color: #f1f5f9; padding: 16px; border: 1px solid rgba(255,255,255,0.1); }
    .header { display: flex; items-center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; margin-bottom: 14px; }
    .logo { font-size: 13px; font-weight: 800; color: #00E5FF; letter-spacing: 0.5px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; background: rgba(0,229,255,0.15); color: #00E5FF; border: 1px solid rgba(0,229,255,0.3); }
    .status-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; margin-bottom: 14px; text-align: center; }
    .count { font-size: 28px; font-weight: 900; color: #38bdf8; margin: 4px 0; }
    .status-label { font-size: 11px; color: #94a3b8; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-sync { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; box-shadow: 0 0 12px rgba(2,132,199,0.3); }
    .btn-sync:hover { background: #0369a1; }
    .btn-copy { background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.12); }
    .btn-copy:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .toast { font-size: 11px; padding: 8px; border-radius: 6px; margin-top: 8px; text-align: center; display: none; }
    .toast.success { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .toast.error { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .footer { font-size: 10px; color: #64748b; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡ AIESEC EVENT RADAR</span>
    <span class="badge" id="host-badge">Scanning...</span>
  </div>

  <div class="status-card">
    <div class="status-label">Events Detected on Page</div>
    <div class="count" id="event-count">0</div>
    <div class="status-label" id="page-url">Looking for events...</div>
  </div>

  <button class="btn btn-sync" id="btn-sync">⚡ Sync Directly to Radar</button>
  <button class="btn btn-copy" id="btn-copy">📋 Copy Events JSON</button>

  <div class="toast" id="toast"></div>

  <div class="footer">AIESEC in Egypt • Autonomous Social Harvester v1.0</div>

  <script src="popup.js"></script>
</body>
</html>
