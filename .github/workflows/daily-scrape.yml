name: Daily AIESEC Radar Scrape & Live Site Sync

on:
  schedule:
    # Runs everyday at 03:00 UTC (05:00 AM Cairo Time)
    - cron: '0 3 * * *'
  workflow_dispatch: # Enables 1-click manual trigger button in GitHub Actions tab

jobs:
  scrape-and-sync:
    name: Execute Scrapers & Update Live Radar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium
          pip install -e .

      - name: Restore Meta Authenticated Session (if configured)
        env:
          FB_STORAGE_STATE: ${{ secrets.FB_STORAGE_STATE }}
        run: |
          mkdir -p data/meta_session
          if [ -n "$FB_STORAGE_STATE" ]; then
            echo "Restoring authenticated Facebook session from repository secret..."
            echo "$FB_STORAGE_STATE" | base64 --decode > data/meta_session/storage_state.json
            echo "Session state restored successfully."
          else
            echo "No FB_STORAGE_STATE secret found. Running in public discovery mode."
          fi

      - name: Run Scraping Pipeline
        run: |
          python scripts/daily_scrape.py

      - name: Commit & Push Changes to Live Site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json docs/events.json aiesec_scraper/web/static/events.json data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-sync): live event radar refresh [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Radar database is already up to date. No changes detected."
          fi
